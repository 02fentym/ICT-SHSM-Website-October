name: Publish October website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore original website images
        shell: bash
        run: |
          if compgen -G 'website-assets.part*' > /dev/null; then
            cat website-assets.part* > "$RUNNER_TEMP/assets.zip"
            unzip -q -o "$RUNNER_TEMP/assets.zip" -d .
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Characters
            git rm website-assets.part*
            git commit -m 'Save all original character and classroom assets'
            git push
          fi
      - name: Prepare site files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html style.css script.js *.png *.jpg "$RUNNER_TEMP/site/"
          cp -R Characters "$RUNNER_TEMP/site/Characters"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
