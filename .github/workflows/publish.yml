name: Publish October website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html style.css script.js *.png *.jpg "$RUNNER_TEMP/site/"
          cp -R Characters "$RUNNER_TEMP/site/Characters"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
